# Local Postgres for manual/CLI use of the persistence module. The persistence module's own
# tests don't use this — they spin up an ephemeral Testcontainers Postgres instead — this is only
# for running something against a database that survives between runs (e.g. a future CLI/backend
# main class, or poking around with psql).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_automation
      POSTGRES_USER: agentic_automation
      POSTGRES_PASSWORD: agentic_automation
    ports:
      - "5432:5432"
    volumes:
      - agentic-automation-postgres-data:/var/lib/postgresql/data

volumes:
  agentic-automation-postgres-data:
